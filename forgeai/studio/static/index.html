<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForgeAI Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23191A18'/%3E%3Cpath d='M10 9h12v3h-8.5v3.2H21v3h-7.5V23H10z' fill='%23F6F4EE'/%3E%3C/svg%3E">
<link rel="stylesheet" href="studio.css">
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand"><b>ForgeAI</b><span>Studio</span></div>
    <button class="nav" data-route="overview"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="11" y="3" width="6" height="6" rx="1.5"/><rect x="3" y="11" width="6" height="6" rx="1.5"/><rect x="11" y="11" width="6" height="6" rx="1.5"/></svg>Overview</button>
    <button class="nav" data-route="build"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 16l5-5M11 4l5 5-6 6-5-5z"/></svg>Build an agent</button>
    <button class="nav" data-route="report"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 3h7l3 3v11H5z"/><path d="M8 9h5M8 12h5M8 15h3"/></svg>Report</button>
    <button class="nav" data-route="cases"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 5h12M4 10h12M4 15h12"/><circle cx="4" cy="5" r=".5"/></svg>Eval cases</button>
    <button class="nav" data-route="chat"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 5h12v8H9l-4 3v-3H4z"/></svg>Chat with the agent</button>
    <button class="nav" data-route="brief"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="14" height="10" rx="1.5"/><path d="M10 14v3M7 17h6"/></svg>The brief</button>
    <button class="nav" data-route="explain"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7"/><path d="M8.5 7.2v5.6L13 10z" fill="currentColor"/></svg>How it works</button>
    <div class="foot"><div><span class="dot"></span><span id="envline">local</span></div><div id="verline" class="faint"></div></div>
  </aside>
  <main>
    <div class="top">
      <h1 id="title">Overview</h1>
      <div class="sp"></div>
      <div class="picker" id="picker"><button id="pickbtn"><span class="faint mono">run</span><span id="pickname" class="clip">-</span><svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 4.5l3 3 3-3" stroke="currentColor" fill="none"/></svg></button><div class="menu" id="pickmenu"></div></div>
      <button class="btn" id="theme" title="Toggle light/dark">◐</button>
    </div>
    <div class="page" id="page"></div>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"></div>
<script src="map.js"></script>
<script src="studio.js"></script>
<script src="explain.js"></script>
<script src="brief.js"></script>
</body>
</html>

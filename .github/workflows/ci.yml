name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: replay a committed demo run without any model
        if: hashFiles('demos/hr-shore-staff/run/manifest.json') != ''
        run: python -m forgeai replay demos/hr-shore-staff/run --out ${{ runner.temp }}/replay-hr
      - name: replay the procurement demo without any model
        if: hashFiles('demos/ship-spares-procurement/run/manifest.json') != ''
        run: python -m forgeai replay demos/ship-spares-procurement/run --out ${{ runner.temp }}/replay-proc
